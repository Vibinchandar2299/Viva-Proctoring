server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:vivatest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

app:
  go-router:
    url: http://localhost:8082
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  python-ai:
    stub-enabled: true
  evidence:
    storage-path: ./target/test-evidence
